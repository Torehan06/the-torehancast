# Results-only races in Minnesota: vote totals and percent reporting, no model, no prior.
# Schema: docs/config.md. `none` races render "no votes reported for this race".
results:
  sources:
    sos_house:
      adapter: mn_sos
      url: https://electionresultsfiles.sos.mn.gov/20261103/ushousecty.txt
      election_id: '2026-11-03'
      status: ready
      polls_close: '2026-11-03T20:00:00-06:00'
      contests:
      - office: house
        districts: all
        template: U.S. Representative District {n}
      notes: Per-office county file; contest names and test data read from the VM Nov 2.
