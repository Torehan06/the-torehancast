# Private poller settings. Never serve config/ from the public site.
# No 2026 live election IDs have been verified here; null means not configured.
# Historical/reference URLs are not live feed URLs. No network checks run on validate.
# GA url: complete API URL for the statewide document (county URLs derived by adapter).
# NC url: complete precinct-results ZIP URL. FL url: POST endpoint; set ElectionDate
# in params and election_id to the election date when verified. Reload each poll cycle.
feeds:
  2026-GA-SEN:
    adapter: ga_enhanced_voting
    url: null
    election_id: null
    status: pending
    reference_url: https://results.sos.ga.gov/results/public
    notes: Set the verified live URL and election ID before marking ready. Reference
      URL is for discovery only.
  2026-NC-SEN:
    adapter: nc_sbe
    url: null
    election_id: null
    status: pending
    reference_url: https://s3.amazonaws.com/dl.ncsbe.gov/ENRS
    notes: Set the verified live URL and election ID before marking ready. Reference
      URL is for discovery only.
  2026-FL-SEN-SPECIAL:
    adapter: fl_dos
    url: https://results.elections.myflorida.com/ResultsExtract.Asp
    election_id: null
    status: pending
    reference_url: https://results.elections.myflorida.com/ResultsExtract.Asp
    notes: Set the verified live URL and election ID before marking ready. Reference
      URL is for discovery only.
    params:
      OfficialResults: N
      PartyRaces: N
      DataMode: ''
      FormsButton2: Download
