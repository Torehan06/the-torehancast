# Replays: feed a past election through the pipeline as if it were arriving live.
#
# Each replay mirrors the state's live setup: `baseline` plays the role 2024 (or
# 2022) plays on Nov 3, `target` is the election being "called", and `tau_pair`
# is the preceding pair that tau is learned from (never the replay pair itself).
#
# `prior` is what a forecaster could have entered *before* that election night:
# two-party D−R margin (+0.01 = D+1) ± sd, and expected two-party turnout relative
# to the baseline. Margins are the final pre-election polling averages (archived
# aggregator tables on each race's Wikipedia page: 270toWin, 538, Silver Bulletin,
# The Hill/DDHQ, Oct 2026), converted to two-party: margin / (D% + R%). They were
# first entered from memory, which leaked hindsight: Iowa was R+8 from memory
# against an R+4.5 average and an R+13 result. Turnout ratios remain estimates.
# The acceptance tests include a deliberately wrong prior too.

GA:
  primary:
    baseline: 2020_sen
    target: 2022_sen
    tau_pair: [2016_sen, 2020_sen]
    prior: {margin: -0.010, margin_sd: 0.06, turnout_ratio: 0.80, turnout_sd: 0.12}  # 538 final: Walker +1.0
  secondary:
    baseline: 2022_sen
    target: 2024_pres
    tau_pair: [2016_sen, 2020_sen]
    prior: {margin: -0.012, margin_sd: 0.06, turnout_ratio: 1.30, turnout_sd: 0.12}  # avg: Trump +1.2
  batch_vote_types: [early, mail]

NC:
  primary:
    baseline: 2020_pres
    target: 2024_pres
    tau_pair: [2016_pres, 2020_pres]
    prior: {margin: -0.012, margin_sd: 0.06, turnout_ratio: 1.02, turnout_sd: 0.10}  # avg: Trump +1.2
  batch_vote_types: [early, mail]

FL:
  primary:
    baseline: 2018_sen
    target: 2024_sen
    tau_pair: [2012_sen, 2018_sen]
    prior: {margin: -0.051, margin_sd: 0.06, turnout_ratio: 1.30, turnout_sd: 0.12}  # 270toWin: Scott +4.8
  # Florida's feed has no vote types; BatchTracker infers pre-Election-Day vs
  # Election Day from precincts reporting. The baseline has no split either, so it
  # is split synthetically at the baseline year's real pre-Election-Day share, and
  # the replayed night is synthesised at the target year's:
  #   2018: 2,720,505 early + 2,623,798 mail of ~8.29M ballots ≈ 0.645
  #         (Division of Elections, early-voting-and-vote-by-mail-report-2018-gen)
  #   2024: 5,363,013 early + 3,022,516 mail of ~10.97M ≈ 0.765 (DOS final, via CBS Miami)
  # Live, with the 2024 baseline, early_share is 0.765. The gap prior is deliberately
  # agnostic.
  vote_split: delta
  arrival_profile:
    batch_types: [early]
    late_types: []
    # Florida law: early and mail ballots are tabulated and posted before any precinct.
    batch_before_precincts: true
    # Real-world hazard: big counties sometimes post more mail ballots after precincts
    # start (mail is valid if it reaches a supervisor's office by 7 pm; Lee County,
    # for one, adds branch-office drop-offs to its tally later that night).
    # BatchTracker books those as Election Day. No statewide count of such ballots is
    # published, so 40% of counties × 1–5% of their pre-Election-Day vote is a stress
    # setting, and it barely matters: over 40 nights, 80% coverage is 0.87 with no late
    # mail, 0.89 at this setting and 0.91 at double it (80% × 2–10%); worst P(wrong)
    # 0.13–0.14 in all three.
    late_mail: {probability: 0.4, share: [0.01, 0.05]}
    # The Panhandle west of the Apalachicola is on Central time; polls close an hour
    # later there. (Gulf County is split between zones; treated as Eastern.)
    late_close:
      hours: 1.0
      units: [ESCAMBIA, SANTA ROSA, OKALOOSA, WALTON, HOLMES, WASHINGTON, BAY, JACKSON, CALHOUN]
  synthetic_split: {early_share: 0.645, gap: 0.0, shift_sd: 0.30, share_sd: 0.15, gap_shift_sd: 0.10, gap_sd: 0.05}
  synthetic_target: {early_share: 0.765}

SC:
  primary:
    baseline: 2020_pres
    target: 2024_pres
    tau_pair: [2016_pres, 2020_pres]
    prior: {margin: -0.135, margin_sd: 0.06, turnout_ratio: 1.02, turnout_sd: 0.10}  # no average; Winthrop R+10, ActiVote R+17
  batch_vote_types: [early, mail]

MN:
  primary:
    baseline: 2020_pres
    target: 2024_pres
    tau_pair: [2016_pres, 2020_pres]
    prior: {margin: 0.060, margin_sd: 0.06, turnout_ratio: 1.00, turnout_sd: 0.10}  # avg: Harris +5.7
  arrival_profile:
    batch_types: []
    chunked_types: [all]
    late_types: []

IA:
  primary:
    baseline: 2020_pres
    target: 2024_pres
    tau_pair: [2016_pres, 2020_pres]
    prior: {margin: -0.047, margin_sd: 0.06, turnout_ratio: 1.00, turnout_sd: 0.10}  # avg: Trump +4.5 (result R+13)
  batch_vote_types: [early]

# Alaska: the baseline is the August top-4 primary, the same structure Nov 3 uses
# (Aug 2026 primary → Nov 2026 general). Units are House districts plus "99"
# (overseas absentee). Margins are party blocs (see elections.yaml).
# Early votes are reported by district on election night; most absentee (mail)
# and questioned (provisional) ballots are counted in the following two weeks.
# Prior margin: no polling average exists. The one public general-election poll
# (Cygnal for Begich/NRCC, Oct 14–16) has the R bloc +2.2 two-party; raters had it
# Lean/Tilt D; DDHQ's model gave Begich 62%. Hence near tied, slight R lean.
# turnout_ratio is general ÷ primary two-party votes; 2.8 is an estimate for a
# presidential year (2022's 1.4 is not comparable: that primary ran alongside a
# special general).
AK:
  primary:
    baseline: 2024_prim_house
    target: 2024_gen_house
    tau_pair: [2022_prim_house, 2022_gen_house]
    prior: {margin: -0.010, margin_sd: 0.06, turnout_ratio: 2.80, turnout_sd: 0.15}  # see above
  batch_vote_types: [early]
  arrival_profile:
    batch_types: [early]
    chunked_types: [election_day]
    late_types: [mail, provisional]
  # A primary and a general draw different electorates by vote type, and one
  # historical pair under-measures that: 2022 prim→gen moved the early-vs-district
  # gap by about 7 pts, 2024 prim→gen by about 17 (early went from D+12 to R+5
  # relative to the district). With the default 0.08 floor, early votes landing
  # first read as a big R swing (80% coverage 0.56, 0.05 at the 50% checkpoint).
  # Coverage is flat for any floor from 0.15 to 0.25, so this is not a knife edge.
  # gap_sd: the 2022 pair measured 4.2 pts of district gap noise, so the first few
  # districts with absentees in outweighed the prior ~40:1 (ed_first: P(D) 0.987
  # in an R win). 0.06 still fails the bad-prior check; 0.08 and 0.10 pass.
  # These are replay-tuned. The live model (tau pair 2024 prim→gen, which also
  # measures only the 0.08 floor) must apply the same floor.
  composition_floor: {gap_shift_sd: 0.15, gap_sd: 0.08}
